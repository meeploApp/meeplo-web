<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Un anuncio en Meeplo</title>
  <meta name="description" content="Juegos de mesa usados cerca de ti. Abre el anuncio en la app.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Meeplo">
  <meta property="og:locale" content="es_MX">
  <meta property="og:title" content="Mira este anuncio en Meeplo">
  <meta property="og:description" content="Juegos de mesa usados cerca de ti. Abre el anuncio en la app.">
  <meta property="og:image" content="https://meeplo.com.mx/assets/meeplo.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="228">
  <meta property="og:image:height" content="228">
  <meta property="og:image:alt" content="La mascota amarilla de Meeplo sobre un fondo morado">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Mira este anuncio en Meeplo">
  <meta name="twitter:description" content="Juegos de mesa usados cerca de ti. Abre el anuncio en la app.">
  <meta name="twitter:image" content="https://meeplo.com.mx/assets/meeplo.png">
  <meta name="twitter:image:alt" content="La mascota amarilla de Meeplo sobre un fondo morado">
  <style>
    :root { --bg: #ffffff; --text: #1c1b1f; --muted: #5f5b66; --accent: #4a44c6; --on-accent: #ffffff; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #141218; --text: #ece6f0; --muted: #b5adbf; --accent: #5e58d6; --on-accent: #ffffff; }
    }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg);
           color: var(--text); font: 17px/1.45 -apple-system, system-ui, "Segoe UI", Roboto, sans-serif; }
    main { max-width: 26rem; padding: 2rem 1rem; text-align: center; }
    h1 { font-size: 1.6rem; margin: 0 0 .5rem; }
    p { color: var(--muted); margin: 0 0 1.5rem; }
    .stores { display: flex; flex-direction: column; gap: .75rem; }
    a.store { display: block; padding: .85rem 1rem; border-radius: 999px; background: var(--accent);
              color: var(--on-accent); text-decoration: none; font-weight: 600; }
    a.store[hidden] { display: none; }
    small { display: block; margin-top: 1.5rem; color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <h1>Este anuncio está en Meeplo</h1>
    <p>Descarga Meeplo para ver el anuncio y escribirle a quien lo vende.</p>
    <div class="stores">
      <!-- Fill in each store's address once the app is published there; a link left empty stays hidden. -->
      <a class="store" id="app-store" href="" hidden>Descargar en el App Store</a>
      <a class="store" id="google-play" href="https://play.google.com/store/apps/details?id=com.meeplo.meeploapp" hidden>Disponible en Google Play</a>
    </div>
    <small>Si ya tienes Meeplo, abre este enlace desde tu teléfono.</small>
  </main>
  <script>
    // Nothing of the listing is read here: the page shows the same text for every link.
    for (const link of document.querySelectorAll("a.store")) {
      if (link.getAttribute("href")) link.hidden = false;
    }
    // On Android, where the app would have opened this link itself if it were installed, go straight to
    // its Play page.
    const play = document.getElementById("google-play").getAttribute("href");
    if (play && /Android/i.test(navigator.userAgent)) location.replace(play);
  </script>
</body>
</html>
